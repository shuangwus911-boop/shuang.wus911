name: Daily Product Crawl

on:
  schedule:
    # 每天 UTC 6:00 (北京时间 14:00)
    - cron: '0 6 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Puppeteer browsers
        run: npx puppeteer browsers install chrome
      
      - name: Run crawler
        env:
          # 兼容两种命名方式，supabase-client.ts 会同时检查
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run crawl
      
      - name: Send DingTalk notification (on success)
        if: success()
        env:
          DINGTALK_TOKEN: ${{ secrets.DINGTALK_TOKEN }}
        run: |
          if [ -z "$DINGTALK_TOKEN" ]; then
            echo "DingTalk token not set, skipping notification"
            exit 0
          fi
          curl -s 'https://oapi.dingtalk.com/robot/send?access_token='"$DINGTALK_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{
              \"msgtype\": \"markdown\",
              \"markdown\": {
                \"title\": \"每日选品报告\",
                \"text\": \"## 每日选品报告\\n\\n爬虫任务执行成功。\\n\\n[查看详情](https://shuang-wus911-git-main-shuangwus911-boops-projects.vercel.app/dashboard)\"
              }
            }"
      
      - name: Send DingTalk notification (on failure)
        if: failure()
        env:
          DINGTALK_TOKEN: ${{ secrets.DINGTALK_TOKEN }}
        run: |
          if [ -z "$DINGTALK_TOKEN" ]; then
            echo "DingTalk token not set, skipping notification"
            exit 0
          fi
          curl -s 'https://oapi.dingtalk.com/robot/send?access_token='"$DINGTALK_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{
              \"msgtype\": \"markdown\",
              \"markdown\": {
                \"title\": \"爬虫任务失败\",
                \"text\": \"## 爬虫任务失败\\n\\n请检查 [GitHub Actions 日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\"
              }
            }"
